# docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  frontend:
    build:
      target: dev
    ports: !override
      - "5173:5173"
    environment:
      VITE_USE_POLLING: "1"
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./FRONTEND:/app
      - /app/node_modules

  backend:
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./BACKEND_MOCK/app:/app/app
