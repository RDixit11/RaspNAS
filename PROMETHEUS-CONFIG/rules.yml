groups:
  - name: Reguly alertow
    rules:
      - alert: WysokieZuzycieCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Wysokie uzycie cpu"
      - alert: WysokieZuzyciePamieci
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Wysokie zuzycie pamieci RAM"

      - alert: WysokieZuzycieDysku
        expr: (1 - (node_filesystem_free_bytes{device="/dev/sda2"} / node_filesystem_size_bytes{device="/dev/sda2"})) * 100 > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Wysokie zuzycie dysku"
